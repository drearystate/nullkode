name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  # Known high or critical advisories in the production dependencies fail the
  # build. It reads pnpm-lock.yaml and asks the npm registry, so it needs no
  # install. Accepted exceptions: package.json pnpm.auditConfig.ignoreGhsas,
  # explained in docs/security-audit-exceptions.md.
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20.19.2

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.33.4
          run_install: false

      - name: Dependency audit
        run: pnpm audit --prod --audit-level=high

  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: nullkode
          POSTGRES_PASSWORD: nullkode
          POSTGRES_DB: nullkode_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U nullkode"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgres://nullkode:nullkode@localhost:5432/nullkode_test
      AUTH_SECRET: ci-secret-not-for-production-only-for-tests-32ch
      PUBLIC_BASE_URL: http://localhost:3001
      NK_CLAUDE_RUNNER_DISABLE: "1"
      NEXT_TELEMETRY_DISABLED: "1"

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20.19.2

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.33.4
          run_install: false

      - name: Cache pnpm store
        uses: actions/cache@v4
        with:
          path: ~/.local/share/pnpm/store
          key: pnpm-${{ runner.os }}-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: pnpm-${{ runner.os }}-

      - run: pnpm install --frozen-lockfile

      - name: Documentation is current
        run: node scripts/check-docs.mjs

      - name: Prisma generate
        run: pnpm exec prisma generate

      - name: Prisma push (schema sanity)
        run: pnpm exec prisma db push

      - name: Typecheck (main app)
        run: pnpm typecheck

      - name: Generated browser scripts parse
        run: pnpm check:js

      - name: Middleware (Server Action probes, per-app robots.txt and sitemap)
        run: pnpm check:middleware

      - name: Build Next
        run: pnpm exec next build

      - name: Backup scripts parse
        run: for f in scripts/backup.sh scripts/backup-loop.sh scripts/restore.sh docs/deploy/systemd/nullkode-backup.sh; do bash -n "$f"; done

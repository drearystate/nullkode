name: nullkode

# Every service keeps at most 5 log files of 10 MB each (docker compose logs
# shows them), so logs can't fill the disk.
x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

# Database access for the backup and restore services.
x-backup-env: &backup-env
  PGHOST: db
  PGUSER: nullkode
  PGDATABASE: nullkode
  PGPASSWORD: ${DB_PASSWORD:?Run the installer to create .env first}
  TZ: ${TZ:-UTC}

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: nullkode
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Run the installer to create .env first}
      POSTGRES_DB: nullkode
    volumes:
      - database:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nullkode -d nullkode"]
      interval: 5s
      timeout: 5s
      retries: 20
    logging: *logging
  app:
    build:
      context: .
      args:
        # 1 adds the optional Android APK builder (JDK 17 + Google's Android
        # SDK, which means accepting its license). The installer asks and
        # saves the answer in .env. See docs/install.md.
        NULLKODE_ANDROID: ${NULLKODE_ANDROID:-0}
        # 1 adds Node 22 and the native engine's packages (about 800 MB): Expo Go
        # previews of the native app, and store builds with NULLKODE_ANDROID=1.
        # See docs/native-apps.md.
        NULLKODE_NATIVE_ENGINE: ${NULLKODE_NATIVE_ENGINE:-0}
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    env_file: .env
    environment:
      DATABASE_URL: postgresql://nullkode:${DB_PASSWORD}@db:5432/nullkode
      # The scheduler service below checks for due scheduled workflows every
      # minute, so the app doesn't run its own timer as well.
      NK_EXTERNAL_SCHEDULER: ${NK_EXTERNAL_SCHEDULER:-1}
      # Game Studio (docs/games.md): the engine kits, design playbook and asset
      # search ship in games/. The asset library is built on this computer
      # (bash games/setup-library.sh) and mounted below, read-only.
      NK_GAME_KITS: /app/games/engine/kits
      NK_GAME_DESIGN: /app/games/design
      NK_ASSET_SEARCH: /app/games/tools/asset-search.mjs
      NK_GAME_ASSETS: /app/games/library
      NK_ASSET_INDEX: /app/games/library/_index/assets.db
    ports:
      - "${BIND_ADDRESS:-127.0.0.1}:${APP_PORT:-3001}:3001"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - uploads:/app/uploads
      - public_uploads:/app/public/uploads
      - imported_assets:/app/public/assets/cloned
      # The Game Studio's asset library (about 1 GB once built). Until it is
      # built the folder is empty and the Game Studio says it isn't set up.
      # Elsewhere on this computer: NK_GAME_LIBRARY=/path/to/library in .env.
      - ${NK_GAME_LIBRARY:-./games/library}:/app/games/library:ro
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3001/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      start_period: 90s
      interval: 10s
      timeout: 5s
      retries: 12
    logging: *logging
  scheduler:
    image: node:20.19.2-bookworm-slim
    restart: unless-stopped
    depends_on:
      app:
        condition: service_healthy
    environment:
      CRON_SECRET: ${CRON_SECRET:?Run the installer to generate CRON_SECRET}
    volumes:
      - ./scripts/scheduler.mjs:/scheduler.mjs:ro
    command: ["node", "/scheduler.mjs"]
    logging: *logging
  # Nightly backups while the app keeps running: the database, uploaded files,
  # and once a week imported website files, into ./backups (or BACKUP_DIR).
  # Settings: BACKUP_* in .env (see .env.example). One backup now:
  # bash scripts/backup.sh, or docker compose run --rm backup once.
  # See docs/install.md and docs/deploy/RESTORE.md.
  backup:
    build:
      context: ./scripts
      dockerfile: backup.Dockerfile
    restart: unless-stopped
    init: true
    depends_on:
      db:
        condition: service_healthy
    environment:
      <<: *backup-env
      BACKUP_TIME: ${BACKUP_TIME:-03:30}
      BACKUP_WEEKLY_DAY: ${BACKUP_WEEKLY_DAY:-7}
      BACKUP_KEEP_DAILY: ${BACKUP_KEEP_DAILY:-7}
      BACKUP_KEEP_WEEKLY: ${BACKUP_KEEP_WEEKLY:-4}
      BACKUP_PASSPHRASE: ${BACKUP_PASSPHRASE:-}
      BACKUP_HEARTBEAT_URL: ${BACKUP_HEARTBEAT_URL:-}
    volumes:
      - ${BACKUP_DIR:-./backups}:/backups
      - ./.env:/nullkode/.env:ro
      - ./package.json:/nullkode/package.json:ro
      # Read-only: backups never change your files.
      - uploads:/nullkode/uploads:ro
      - public_uploads:/nullkode/public/uploads:ro
      - imported_assets:/nullkode/public/assets/cloned:ro
    logging: *logging
  # Restores a backup into a new, empty installation. Never starts by itself;
  # scripts/restore.sh runs it (or: docker compose run --rm restore <backup>).
  restore:
    build:
      context: ./scripts
      dockerfile: backup.Dockerfile
    profiles: ["restore"]
    init: true
    depends_on:
      db:
        condition: service_healthy
    environment:
      <<: *backup-env
    entrypoint: ["/usr/local/bin/nk-backup", "restore"]
    volumes:
      - ${BACKUP_DIR:-./backups}:/backups:ro
      - uploads:/nullkode/uploads
      - public_uploads:/nullkode/public/uploads
      - imported_assets:/nullkode/public/assets/cloned
    logging: *logging
  # Automatic HTTPS. Runs only in HTTPS mode: the installer sets
  # COMPOSE_PROFILES=https in .env when you give it a domain name (without
  # one, the app is plain http on APP_PORT). Caddy answers on ports 80 and
  # 443, gets a certificate for each address the app approves and passes
  # requests on to the app. See Caddyfile and docs/install.md.
  caddy:
    image: caddy:2.11.4-alpine
    profiles: ["https"]
    restart: unless-stopped
    depends_on:
      - app
    environment:
      NK_TLS_ASK_SECRET: ${NK_TLS_ASK_SECRET:-}
      NK_TLS_EMAIL: ${NK_TLS_EMAIL:-}
    ports:
      # Let's Encrypt checks ports 80 and 443. Change HTTP_PORT/HTTPS_PORT only
      # when a router forwards those public ports to other ports here.
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
      - "${HTTPS_PORT:-443}:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      # Certificates and the Let's Encrypt account. Keep it: getting every
      # certificate again at once can hit Let's Encrypt's weekly limits.
      - caddy_data:/data
      - caddy_config:/config
    logging: *logging
volumes:
  database:
  uploads:
  public_uploads:
  imported_assets:
  caddy_data:
  caddy_config:

name: nullkode
services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: nullkode
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Run the installer to create .env first}
      POSTGRES_DB: nullkode
    volumes:
      - database:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nullkode -d nullkode"]
      interval: 5s
      timeout: 5s
      retries: 20
  app:
    build:
      context: .
      args:
        # 1 adds the optional Android APK builder (JDK 17 + Google's Android
        # SDK, which means accepting its license). The installer asks and
        # saves the answer in .env. See START-HERE.md.
        NULLKODE_ANDROID: ${NULLKODE_ANDROID:-0}
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    env_file: .env
    environment:
      DATABASE_URL: postgresql://nullkode:${DB_PASSWORD}@db:5432/nullkode
    ports:
      - "${BIND_ADDRESS:-127.0.0.1}:${APP_PORT:-3001}:3001"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - uploads:/app/uploads
      - public_uploads:/app/public/uploads
      - imported_assets:/app/public/assets/cloned
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3001/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      start_period: 90s
      interval: 10s
      timeout: 5s
      retries: 12
  scheduler:
    image: node:20.19.2-bookworm-slim
    restart: unless-stopped
    depends_on:
      app:
        condition: service_healthy
    environment:
      CRON_SECRET: ${CRON_SECRET:?Run the installer to generate CRON_SECRET}
    volumes:
      - ./scripts/scheduler.mjs:/scheduler.mjs:ro
    command: ["node", "/scheduler.mjs"]
  # Automatic HTTPS. Runs only in HTTPS mode: the installer sets
  # COMPOSE_PROFILES=https in .env when you give it a domain name (without
  # one, the app is plain http on APP_PORT). Caddy answers on ports 80 and
  # 443, gets a certificate for each address the app approves and passes
  # requests on to the app. See Caddyfile and START-HERE.md.
  caddy:
    image: caddy:2.11.4-alpine
    profiles: ["https"]
    restart: unless-stopped
    depends_on:
      - app
    environment:
      NK_TLS_ASK_SECRET: ${NK_TLS_ASK_SECRET:-}
      NK_TLS_EMAIL: ${NK_TLS_EMAIL:-}
    ports:
      # Let's Encrypt checks ports 80 and 443. Change HTTP_PORT/HTTPS_PORT only
      # when a router forwards those public ports to other ports here.
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
      - "${HTTPS_PORT:-443}:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      # Certificates and the Let's Encrypt account. Keep it: getting every
      # certificate again at once can hit Let's Encrypt's weekly limits.
      - caddy_data:/data
      - caddy_config:/config
volumes:
  database:
  uploads:
  public_uploads:
  imported_assets:
  caddy_data:
  caddy_config:

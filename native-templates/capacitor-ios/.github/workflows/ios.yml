# Builds the iOS app on one of GitHub's Mac computers and uploads it to
# TestFlight. It only runs when you start it: Actions tab > "iOS (TestFlight)"
# > Run workflow. Set-up steps: README.md, section "iOS without a Mac".
name: iOS (TestFlight)

on:
  workflow_dispatch:
    inputs:
      build_number:
        description: "Build number (leave empty to use today's date and time)"
        required: false
        default: ""

permissions:
  contents: read

concurrency:
  group: ios-testflight
  cancel-in-progress: false

jobs:
  testflight:
    name: Build and upload to TestFlight
    # The newest macOS runner by default. To choose one, add a repository
    # variable IOS_RUNNER (for example macos-26).
    runs-on: ${{ vars.IOS_RUNNER || 'macos-latest' }}
    timeout-minutes: 60
    env:
      PROJECT: ios/App/App.xcodeproj
      SCHEME: App
    steps:
      - name: Check the repository secrets
        env:
          IOS_CERTIFICATE_P12: ${{ secrets.IOS_CERTIFICATE_P12 }}
          IOS_CERTIFICATE_PASSWORD: ${{ secrets.IOS_CERTIFICATE_PASSWORD }}
          IOS_PROVISIONING_PROFILE: ${{ secrets.IOS_PROVISIONING_PROFILE }}
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          APP_STORE_CONNECT_KEY: ${{ secrets.APP_STORE_CONNECT_KEY }}
        run: |
          missing=""
          for name in IOS_CERTIFICATE_P12 IOS_CERTIFICATE_PASSWORD IOS_PROVISIONING_PROFILE \
                      APP_STORE_CONNECT_KEY_ID APP_STORE_CONNECT_ISSUER_ID APP_STORE_CONNECT_KEY; do
            if [ -z "${!name}" ]; then missing="$missing $name"; fi
          done
          if [ -n "$missing" ]; then
            echo "::error::Add these repository secrets first:$missing. README.md, section \"iOS without a Mac\", explains each one."
            exit 1
          fi

      - uses: actions/checkout@v4

      - name: Pick Xcode
        env:
          XCODE_VERSION: ${{ vars.XCODE_VERSION }}
        run: |
          # The newest stable Xcode on the runner, or the repository variable
          # XCODE_VERSION (for example 26.0) if you set one.
          if [ -n "$XCODE_VERSION" ]; then
            app="/Applications/Xcode_${XCODE_VERSION}.app"
          else
            app=$(printf '%s\n' /Applications/Xcode_*.app | grep -Eiv 'beta|release.?candidate|_rc' | sort -V | tail -n 1 || true)
          fi
          if [ -n "$app" ] && [ -d "$app" ]; then
            sudo xcode-select -s "$app/Contents/Developer"
          fi
          xcodebuild -version
          major=$(xcodebuild -version | awk 'NR==1 { split($2, v, "."); print v[1] }')
          if [ "${major:-0}" -lt 26 ]; then
            echo "::warning::App Store Connect only accepts apps built with Xcode 26 or newer, and this runner's newest is Xcode ${major}. Add a repository variable IOS_RUNNER with a newer runner (for example macos-26)."
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Copy the latest app settings into the iOS project
        run: |
          npm install --no-audit --no-fund
          npx cap sync ios

      - name: Install the signing certificate and provisioning profile
        env:
          IOS_CERTIFICATE_P12: ${{ secrets.IOS_CERTIFICATE_P12 }}
          IOS_CERTIFICATE_PASSWORD: ${{ secrets.IOS_CERTIFICATE_PASSWORD }}
          IOS_PROVISIONING_PROFILE: ${{ secrets.IOS_PROVISIONING_PROFILE }}
        run: |
          set -euo pipefail
          KEYCHAIN="$RUNNER_TEMP/signing.keychain-db"
          KEYCHAIN_PASSWORD="$(openssl rand -hex 24)"
          printf '%s' "$IOS_CERTIFICATE_P12" | tr -d ' \r\n\t' | base64 --decode > "$RUNNER_TEMP/certificate.p12"
          printf '%s' "$IOS_PROVISIONING_PROFILE" | tr -d ' \r\n\t' | base64 --decode > "$RUNNER_TEMP/profile.mobileprovision"

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          if ! security import "$RUNNER_TEMP/certificate.p12" -P "$IOS_CERTIFICATE_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN"; then
            echo "::error::Could not open the certificate. Check IOS_CERTIFICATE_P12 and IOS_CERTIFICATE_PASSWORD."
            exit 1
          fi
          security set-key-partition-list -S apple-tool:,apple: -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN" > /dev/null
          security list-keychain -d user -s "$KEYCHAIN"
          rm -f "$RUNNER_TEMP/certificate.p12"

          identities=$(security find-identity -v -p codesigning "$KEYCHAIN")
          echo "$identities"
          if echo "$identities" | grep -q '"Apple Distribution'; then
            SIGN_IDENTITY="Apple Distribution"
          elif echo "$identities" | grep -q '"iPhone Distribution'; then
            SIGN_IDENTITY="iPhone Distribution"
          else
            echo "::error::IOS_CERTIFICATE_P12 is not an Apple Distribution certificate with its private key."
            exit 1
          fi

          security cms -D -i "$RUNNER_TEMP/profile.mobileprovision" > "$RUNNER_TEMP/profile.plist"
          PROFILE_UUID=$(/usr/libexec/PlistBuddy -c 'Print :UUID' "$RUNNER_TEMP/profile.plist")
          TEAM_ID=$(/usr/libexec/PlistBuddy -c 'Print :TeamIdentifier:0' "$RUNNER_TEMP/profile.plist")
          PROFILE_APP_ID=$(/usr/libexec/PlistBuddy -c 'Print :Entitlements:application-identifier' "$RUNNER_TEMP/profile.plist")
          if /usr/libexec/PlistBuddy -c 'Print :ProvisionedDevices' "$RUNNER_TEMP/profile.plist" > /dev/null 2>&1; then
            echo "::error::IOS_PROVISIONING_PROFILE is a development or ad hoc profile. Create an App Store Connect profile instead."
            exit 1
          fi
          BUNDLE_ID=$(grep -m1 'PRODUCT_BUNDLE_IDENTIFIER = ' "$PROJECT/project.pbxproj" | sed -E 's/.*= "?([^";]+)"?;.*/\1/')
          # The profile's app ID can be a wildcard (TEAMID.*), so match it as a pattern.
          # shellcheck disable=SC2254
          case "$TEAM_ID.$BUNDLE_ID" in
            $PROFILE_APP_ID) ;;
            *)
              echo "::error::The provisioning profile is for $PROFILE_APP_ID, but this app is $TEAM_ID.$BUNDLE_ID. Create the profile for bundle ID $BUNDLE_ID."
              exit 1
              ;;
          esac
          for dir in "$HOME/Library/MobileDevice/Provisioning Profiles" "$HOME/Library/Developer/Xcode/UserData/Provisioning Profiles"; do
            mkdir -p "$dir"
            cp "$RUNNER_TEMP/profile.mobileprovision" "$dir/$PROFILE_UUID.mobileprovision"
          done

          {
            echo "KEYCHAIN=$KEYCHAIN"
            echo "SIGN_IDENTITY=$SIGN_IDENTITY"
            echo "PROFILE_UUID=$PROFILE_UUID"
            echo "TEAM_ID=$TEAM_ID"
            echo "BUNDLE_ID=$BUNDLE_ID"
          } >> "$GITHUB_ENV"

      - name: Sign the app with the certificate and profile
        run: |
          set -euo pipefail
          # Only the app target is signed this way. (Build settings given on the
          # xcodebuild command line would also reach the Swift packages, which
          # can't take a provisioning profile.)
          PBX="$PROJECT/project.pbxproj"
          sed -i '' -E '/^[[:space:]]*(DEVELOPMENT_TEAM|PROVISIONING_PROFILE_SPECIFIER|"CODE_SIGN_IDENTITY\[sdk=iphoneos\*\]") = /d' "$PBX"
          sed -i '' -E "s/CODE_SIGN_STYLE = [A-Za-z]+;/CODE_SIGN_STYLE = Manual; DEVELOPMENT_TEAM = $TEAM_ID; PROVISIONING_PROFILE_SPECIFIER = \"$PROFILE_UUID\"; \"CODE_SIGN_IDENTITY[sdk=iphoneos*]\" = \"$SIGN_IDENTITY\";/" "$PBX"
          count=$(grep -c 'CODE_SIGN_STYLE = Manual;' "$PBX" || true)
          if [ "$count" -lt 1 ]; then
            echo "::error::Could not find the app's signing settings in $PBX."
            exit 1
          fi

      - name: Build the app
        env:
          BUILD_NUMBER_INPUT: ${{ github.event.inputs.build_number }}
        run: |
          set -euo pipefail
          BUILD_NUMBER="${BUILD_NUMBER_INPUT:-$(date -u +%Y%m%d.%H%M)}"
          echo "BUILD_NUMBER=$BUILD_NUMBER" >> "$GITHUB_ENV"
          xcodebuild archive \
            -project "$PROJECT" \
            -scheme "$SCHEME" \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/App.xcarchive" \
            CURRENT_PROJECT_VERSION="$BUILD_NUMBER" \
            OTHER_CODE_SIGN_FLAGS="--keychain $KEYCHAIN"

      - name: Upload to TestFlight
        env:
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          APP_STORE_CONNECT_KEY: ${{ secrets.APP_STORE_CONNECT_KEY }}
        run: |
          set -euo pipefail
          KEY_PATH="$RUNNER_TEMP/AuthKey_${APP_STORE_CONNECT_KEY_ID}.p8"
          printf '%s\n' "$APP_STORE_CONNECT_KEY" > "$KEY_PATH"
          if ! grep -q "BEGIN PRIVATE KEY" "$KEY_PATH"; then
            # Also accept the .p8 file as base64.
            printf '%s' "$APP_STORE_CONNECT_KEY" | tr -d ' \r\n\t' | base64 --decode > "$KEY_PATH"
          fi
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>upload</string>
            <key>signingStyle</key><string>manual</string>
            <key>teamID</key><string>${TEAM_ID}</string>
            <key>signingCertificate</key><string>${SIGN_IDENTITY}</string>
            <key>provisioningProfiles</key>
            <dict><key>${BUNDLE_ID}</key><string>${PROFILE_UUID}</string></dict>
            <key>uploadSymbols</key><true/>
            <key>manageAppVersionAndBuildNumber</key><false/>
          </dict>
          </plist>
          PLIST
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/App.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" \
            -exportPath "$RUNNER_TEMP/export" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$KEY_PATH" \
            -authenticationKeyID "$APP_STORE_CONNECT_KEY_ID" \
            -authenticationKeyIssuerID "$APP_STORE_CONNECT_ISSUER_ID"
          {
            echo "### Sent to App Store Connect"
            echo "Build **$BUILD_NUMBER** of **$BUNDLE_ID** was uploaded. It appears in TestFlight when Apple has finished processing it, usually within 30 minutes."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Clean up
        if: always()
        run: |
          security delete-keychain "$RUNNER_TEMP/signing.keychain-db" 2> /dev/null || true
          rm -f "$RUNNER_TEMP"/*.p12 "$RUNNER_TEMP"/*.p8 "$RUNNER_TEMP"/*.mobileprovision "$RUNNER_TEMP/profile.plist"

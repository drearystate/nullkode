<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<title>{{APP_NAME}}</title>
<style>
  html, body { margin: 0; min-height: 100%; }
  body {
    background: {{BG}};
    color: {{FG}};
    font-family: -apple-system, system-ui, "Segoe UI", Roboto, sans-serif;
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    padding: 24px;
    box-sizing: border-box;
    text-align: center;
  }
  main { max-width: 22rem; }
  svg { width: 56px; height: 56px; opacity: .7; }
  h1 { font-size: 1.35rem; line-height: 1.3; margin: 16px 0 8px; font-weight: 600; }
  p { margin: 0 0 24px; line-height: 1.5; opacity: .8; }
  button {
    font: inherit;
    font-weight: 600;
    border: 0;
    border-radius: 999px;
    padding: 12px 28px;
    background: {{ACCENT}};
    color: {{ACCENT_FG}};
    cursor: pointer;
  }
  button:active { opacity: .8; }
  [hidden] { display: none; }
</style>
</head>
<body>
<main>
  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
    <path d="M2 8.8a15 15 0 0 1 4.2-2.9"/>
    <path d="M10.7 5.1A15 15 0 0 1 22 8.8"/>
    <path d="M5 12.5a10 10 0 0 1 5.2-2.6"/>
    <path d="M16.9 11a10 10 0 0 1 2.1 1.5"/>
    <path d="M8.5 16a5 5 0 0 1 7 0"/>
    <path d="M12 19.5h.01"/>
    <path d="M3 3l18 18"/>
  </svg>
  <div id="offline">
    <h1>You're offline</h1>
    <p>Check your internet connection, then try again.</p>
  </div>
  <div id="failed" hidden>
    <h1>This page didn't load</h1>
    <p>Please try again in a moment.</p>
  </div>
  <button id="retry" type="button">Try again</button>
</main>
<script>
  (function () {
    var retryUrl = {{RETRY_URL_JSON}};
    function retry() { location.replace(retryUrl); }
    document.getElementById("retry").addEventListener("click", retry);
    // Online but still failed: the server didn't answer, so don't blame the phone.
    if (navigator.onLine) {
      document.getElementById("offline").hidden = true;
      document.getElementById("failed").hidden = false;
    }
    // Try again by itself as soon as the connection comes back.
    window.addEventListener("online", function () { setTimeout(retry, 800); });
  })();
</script>
</body>
</html>

# nginx reverse-proxy template for Nullkode.
# Drop into /etc/nginx/sites-available/, symlink to sites-enabled/, reload.
# Replace `example.com` with your real domain.

upstream nullkode_app {
    server 127.0.0.1:3001;
    keepalive 32;
}

server {
    listen 80;
    listen [::]:80;
    server_name example.com www.example.com;
    # Redirect everything to HTTPS.
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name example.com www.example.com;

    # TLS (use Let's Encrypt / certbot or your provider's cert).
    ssl_certificate     /etc/letsencrypt/live/example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/example.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    # Reasonable defaults for an SPA + SSE workload.
    client_max_body_size 32M;
    proxy_http_version 1.1;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Connection        "";

    # CRITICAL for the Designer:
    #   - long-running agent generations can take 2-6 minutes
    #   - SSE streams must not be buffered
    proxy_read_timeout 900s;
    proxy_send_timeout 900s;
    proxy_connect_timeout 30s;
    proxy_buffering off;

    location / {
        proxy_pass http://nullkode_app;
    }

    # Static assets served by Next can be aggressively cached. The bundle
    # hash in the filename means cache busts happen automatically on deploy.
    location /_next/static/ {
        proxy_pass http://nullkode_app;
        proxy_cache_valid 200 1y;
        add_header Cache-Control "public, immutable, max-age=31536000";
    }
}

# Apache 2.4 reverse-proxy template for Nullkode.
# Requires mod_proxy, mod_proxy_http, and mod_headers enabled:
#   a2enmod proxy proxy_http headers ssl rewrite

<VirtualHost *:80>
    ServerName example.com
    ServerAlias www.example.com
    Redirect permanent / https://example.com/
</VirtualHost>

<VirtualHost *:443>
    ServerName example.com
    ServerAlias www.example.com

    SSLEngine on
    SSLCertificateFile    /etc/letsencrypt/live/example.com/fullchain.pem
    SSLCertificateKeyFile /etc/letsencrypt/live/example.com/privkey.pem

    # Long-running agent + SSE.
    ProxyTimeout 900
    ProxyPreserveHost On
    ProxyRequests Off

    # Forward to Next.
    ProxyPass        / http://127.0.0.1:3001/
    ProxyPassReverse / http://127.0.0.1:3001/

    RequestHeader set X-Forwarded-Proto "https"
    RequestHeader set X-Forwarded-Host  "%{HTTP_HOST}s"
    # The app trusts X-Real-IP for sign-up protection and rate limits, so
    # always replace whatever the visitor sent with their real address.
    RequestHeader set X-Real-IP "expr=%{REMOTE_ADDR}"

    ErrorLog  ${APACHE_LOG_DIR}/nullkode_error.log
    CustomLog ${APACHE_LOG_DIR}/nullkode_access.log combined
</VirtualHost>
